name: Schema Audit CI
on: [push, pull_request]

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP files
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Good fixture must pass
        run: php tests/run-tests.php pass
      - name: Broken fixture must fail
        run: php tests/run-tests.php fail
